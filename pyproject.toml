[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pkmodel"
version = "0.1.0"
description = "A package to analyse pharmacokinetic models"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "numpy",
    "scipy",
    "matplotlib"
]

[project.urls]
Source = "https://github.com/your-org/your-repo"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov", 
    "ruff"
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py38"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv"
]
