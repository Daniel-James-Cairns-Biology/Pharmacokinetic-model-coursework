[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pkmodel"
version = "0.1.0"
description = "A package to analyse pharmacokinetic models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]
snake = ["pygame"]

[tool.setuptools]
py-modules = ["pk_model"]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [".git", "__pycache__", "build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.coverage.run]
branch = true
source = ["pk_model"]

[tool.coverage.report]
show_missing = true
fail_under = 85
